name: Release & Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0)"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Validate version format
        run: |
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version format '$VERSION'. Use semver (e.g. 0.2.0)"
            exit 1
          fi
        env:
          VERSION: ${{ inputs.version }}
      - name: Verify project version
        run: |
          PROJECT_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          if [ "$PROJECT_VERSION" != "$VERSION" ]; then
            echo "::error::pyproject.toml version is '$PROJECT_VERSION', expected '$VERSION'"
            exit 1
          fi
        env:
          VERSION: ${{ inputs.version }}
      - name: Tag release
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
        env:
          VERSION: ${{ inputs.version }}
      - name: Create GitHub Release
        run: gh release create "v$VERSION" --generate-notes
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: v${{ inputs.version }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
